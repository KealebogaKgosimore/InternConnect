<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | InternConnect</title>
  <link rel="icon" type="image/png" href="assets/img/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="auth-body">
  <nav class="navbar bg-white border-bottom">
    <div class="container py-2">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <img src="assets/img/icon.png" alt="InternConnect" class="brand-icon"> InternConnect
      </a>
      <a class="nav-link" href="index.html">← Back to home</a>
    </div>
  </nav>

  <main class="container auth-wrap py-5">
    <div class="auth-card auth-card-wide">
      <div class="mb-4">
        <span class="eyebrow">Get started</span>
        <h1 class="h2 fw-bold mt-2">Create your account</h1>
        <p class="text-secondary">Tell us a little about yourself to set up your InternConnect profile.</p>
      </div>

      <div id="registerNotice" class="alert d-none" role="alert"></div>

      <form id="registerForm" class="row g-3">
        <div class="col-md-6">
          <label for="fullName" class="form-label">Full name</label>
          <input id="fullName" class="form-control" required placeholder="Your full name">
        </div>

        <div class="col-md-6">
          <label for="accountRole" class="form-label">Account type</label>
          <select id="accountRole" class="form-select" required>
            <option value="">Select account type</option>
            <option value="student">Student</option>
            <option value="company">Company / organisation</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="regEmail" class="form-label">Email address</label>
          <input id="regEmail" type="email" class="form-control" required placeholder="you@example.com">
        </div>

        <div class="col-md-6">
          <label for="phone" class="form-label">Phone number</label>
          <input id="phone" type="tel" class="form-control" placeholder="+267 ...">
        </div>

        <!-- Default placeholder before selecting account type -->
        <div class="col-12" id="defaultOrgGroup">
          <label class="form-label">Institution or organisation</label>
          <input class="form-control" disabled placeholder="Please select an account type above">
        </div>

        <!-- Student Institution Dropdown (Universities in Botswana) -->
        <div class="col-12 d-none" id="studentOrgGroup">
          <label for="studentUniversity" class="form-label">Institution / University in Botswana <span class="text-danger">*</span></label>
          <select id="studentUniversity" class="form-select">
            <option value="">Select your university / institution</option>
            <optgroup label="Public Universities & Colleges">
              <option value="University of Botswana (UB)">University of Botswana (UB)</option>
              <option value="Botswana International University of Science and Technology (BIUST)">Botswana International University of Science and Technology (BIUST)</option>
              <option value="Botswana Accountancy College (BAC)">Botswana Accountancy College (BAC)</option>
              <option value="Botswana University of Agriculture and Natural Resources (BUAN)">Botswana University of Agriculture and Natural Resources (BUAN)</option>
              <option value="Botswana Open University (BOU)">Botswana Open University (BOU)</option>
              <option value="Institute of Development Management (IDM)">Institute of Development Management (IDM)</option>
            </optgroup>
            <optgroup label="Private Universities & Colleges">
              <option value="Botho University">Botho University</option>
              <option value="BA ISAGO University">BA ISAGO University</option>
              <option value="Limkokwing University of Creative Technology">Limkokwing University of Creative Technology (LUCT)</option>
              <option value="Gaborone University College of Law and Professional Studies (GUC)">Gaborone University College of Law and Professional Studies (GUC)</option>
              <option value="ABM University College">ABM University College</option>
              <option value="Boitekanelo College">Boitekanelo College</option>
              <option value="New Era College of Arts, Science and Technology">New Era College of Arts, Science and Technology</option>
            </optgroup>
            <optgroup label="Technical & Vocational Colleges">
              <option value="Gaborone Technical College (GTC)">Gaborone Technical College (GTC)</option>
              <option value="Francistown College of Technical and Vocational Education (FCTVE)">Francistown College of Technical and Vocational Education (FCTVE)</option>
              <option value="Oodi College of Applied Arts and Technology (OCAAT)">Oodi College of Applied Arts and Technology (OCAAT)</option>
            </optgroup>
            <optgroup label="Other">
              <option value="Other">Other (Institution not listed)</option>
            </optgroup>
          </select>
          <div id="otherInstitutionGroup" class="mt-2 d-none">
            <label for="otherInstitution" class="form-label small text-secondary">Specify University / Institution name</label>
            <input id="otherInstitution" class="form-control" placeholder="Enter your institution or college name">
          </div>
        </div>

        <!-- Company Organisation Dropdown & Input -->
        <div class="col-12 d-none" id="companyOrgGroup">
          <label for="companyOrganisationSelect" class="form-label">Company / Organisation <span class="text-danger">*</span></label>
          <select id="companyOrganisationSelect" class="form-select">
            <option value="">Select your company / organisation in Botswana</option>
            <optgroup label="Partner Organisations with Opportunities">
              <option value="Botswana Digital & Innovation Hub (BDIH)">Botswana Digital & Innovation Hub (BDIH)</option>
              <option value="Debswana Diamond Company">Debswana Diamond Company</option>
              <option value="PricewaterhouseCoopers (PwC Botswana)">PricewaterhouseCoopers (PwC Botswana)</option>
              <option value="Botswana Telecommunications Corporation (BTC)">Botswana Telecommunications Corporation (BTC)</option>
              <option value="Botswana Agricultural Marketing Board (BAMB)">Botswana Agricultural Marketing Board (BAMB)</option>
              <option value="Botswana Power Corporation (BPC)">Botswana Power Corporation (BPC)</option>
              <option value="National Food Technology Research Centre (NFTRC)">National Food Technology Research Centre (NFTRC)</option>
              <option value="Botswana Harvard Health Partnership (BHP)">Botswana Harvard Health Partnership (BHP)</option>
              <option value="First National Bank Botswana (FNBB)">First National Bank Botswana (FNBB)</option>
              <option value="Water Utilities Corporation (WUC)">Water Utilities Corporation (WUC)</option>
              <option value="Department of Broadcasting Services (BTV)">Department of Broadcasting Services (BTV)</option>
              <option value="Botswana Tourism Organisation (BTO)">Botswana Tourism Organisation (BTO)</option>
              <option value="Bank of Botswana (BoB)">Bank of Botswana (BoB)</option>
              <option value="Mascom Wireless">Mascom Wireless</option>
              <option value="Khoemacau Copper Mining">Khoemacau Copper Mining</option>
              <option value="Sir Ketumile Masire Teaching Hospital (SKMTH)">Sir Ketumile Masire Teaching Hospital (SKMTH)</option>
            </optgroup>
            <optgroup label="Other">
              <option value="Other">Other / New company (Not listed)</option>
            </optgroup>
          </select>
          <div id="otherCompanyGroup" class="mt-2 d-none">
            <label for="otherCompanyInput" class="form-label small text-secondary">Specify Company / Organisation name</label>
            <input id="otherCompanyInput" class="form-control" placeholder="e.g. Absa Bank Botswana, Stanbic Bank, your company name">
          </div>
          <div class="form-text text-secondary mt-1">
            Existing internship opportunities matching this organisation will automatically connect to your dashboard upon account creation.
          </div>
        </div>

        <!-- Hidden input for backwards compatibility -->
        <input type="hidden" id="organisation" name="organisation" value="">

        <div class="col-md-6">
          <label for="regPassword" class="form-label">Password</label>
          <input id="regPassword" type="password" class="form-control" minlength="8" required placeholder="At least 8 characters">
        </div>

        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <input id="confirmPassword" type="password" class="form-control" minlength="8" required placeholder="Repeat password">
        </div>

        <div class="col-12">
          <div class="form-check">
            <input id="terms" class="form-check-input" type="checkbox" required>
            <label for="terms" class="form-check-label">I confirm that the information provided is accurate.</label>
          </div>
        </div>

        <div class="col-12">
          <button class="btn btn-primary btn-lg w-100" type="submit">Create account</button>
        </div>
      </form>

      <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="login.html" class="fw-semibold">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
