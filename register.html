<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | InternConnect</title><link rel="icon" type="image/png" href="assets/img/icon.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/styles.css" rel="stylesheet"></head>
<body class="auth-body"><nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><img src="assets/img/icon.png" alt="InternConnect" class="brand-icon"> InternConnect</a><a class="nav-link" href="index.html">← Back to home</a></div></nav>
<main class="container auth-wrap py-5"><div class="auth-card auth-card-wide"><div class="mb-4"><span class="eyebrow">Get started</span><h1 class="h2 fw-bold mt-2">Create your account</h1><p class="text-secondary">Tell us a little about yourself to set up your InternConnect profile.</p></div><div id="registerNotice" class="alert d-none" role="alert"></div><form id="registerForm" class="row g-3"><div class="col-md-6"><label for="fullName" class="form-label">Full name</label><input id="fullName" class="form-control" required placeholder="Your full name"></div><div class="col-md-6"><label for="accountRole" class="form-label">Account type</label><select id="accountRole" class="form-select" required><option value="">Select account type</option><option value="student">Student</option><option value="company">Company / organisation</option></select></div><div class="col-md-6"><label for="regEmail" class="form-label">Email address</label><input id="regEmail" type="email" class="form-control" required placeholder="you@example.com"></div><div class="col-md-6"><label for="phone" class="form-label">Phone number</label><input id="phone" type="tel" class="form-control" placeholder="+267 ..."></div><div class="col-12"><label for="organisation" class="form-label">Institution or organisation</label><input id="organisation" class="form-control" placeholder="e.g. your university or company"></div><div class="col-md-6"><label for="regPassword" class="form-label">Password</label><input id="regPassword" type="password" class="form-control" minlength="8" required placeholder="At least 8 characters"></div><div class="col-md-6"><label for="confirmPassword" class="form-label">Confirm password</label><input id="confirmPassword" type="password" class="form-control" minlength="8" required placeholder="Repeat password"></div><div class="col-12"><div class="form-check"><input id="terms" class="form-check-input" type="checkbox" required><label for="terms" class="form-check-label">I confirm that the information provided is accurate.</label></div></div><div class="col-12"><button class="btn btn-primary btn-lg w-100" type="submit">Create account</button></div></form><p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="login.html" class="fw-semibold">Log in</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
</body></html>
