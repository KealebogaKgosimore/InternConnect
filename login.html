<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | InternConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/styles.css" rel="stylesheet"></head>
<body class="auth-body"><nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><span class="brand-mark">IC</span> InternConnect</a><a class="nav-link" href="index.html">← Back to home</a></div></nav>
<main class="container auth-wrap"><div class="auth-card"><div class="text-center mb-4"><span class="brand-mark brand-mark-lg">IC</span><h1 class="h3 fw-bold mt-3">Welcome back</h1><p class="text-secondary">Log in to continue to your InternConnect workspace.</p><span class="badge bg-success-subtle text-success border border-success-subtle mb-2">⚡ Live Supabase Auth</span></div><div id="loginNotice" class="alert d-none" role="alert"></div><form id="loginForm"><div class="mb-3"><label for="email" class="form-label">Email address</label><input id="email" class="form-control form-control-lg" type="email" placeholder="you@example.com" required></div><div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" class="form-control form-control-lg" type="password" placeholder="Enter your password" required></div><div class="mb-4"><label for="role" class="form-label">I am logging in as</label><select id="role" class="form-select form-select-lg" required><option value="">Choose your role</option><option value="student">Student</option><option value="company">Company</option><option value="coordinator">University coordinator</option><option value="admin">Administrator</option></select></div><button class="btn btn-primary btn-lg w-100" type="submit">Log in</button></form><p class="text-center text-secondary mt-4 mb-0">New to InternConnect? <a href="register.html" class="fw-semibold">Create an account</a></p></div></main>
